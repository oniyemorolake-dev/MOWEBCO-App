html,body{height:100%;background:#1a1a2e;display:flex;justify-content:center;align-items:center;font-family:'DM Sans',sans-serif;}

.hdr{background:var(--w);padding:16px 20px 12px;border-bottom:0.5px solid rgba(200,168,233,0.3);flex-shrink:0;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--ld);}
.hdr-sub{font-size:11px;color:var(--tl);margin-top:2px;}
.progress{font-size:11px;color:var(--ld);font-weight:500;}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* LIST VIEW */
.list-view{padding:16px;}
.search{width:100%;padding:10px 14px;border:1.5px solid rgba(200,168,233,0.3);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--t);background:var(--w);outline:none;margin-bottom:12px;}
.filter-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}

.chip.on{background:var(--ld);color:#fff;border-color:var(--ld);}
.salon-card{background:var(--w);border-radius:14px;padding:14px;border:0.5px solid rgba(200,168,233,0.2);margin-bottom:8px;cursor:pointer;transition:transform 0.15s;}
.salon-card:active{transform:scale(0.98);}
.salon-card-top{display:flex;justify-content:space-between;align-items:flex-start;}
.salon-name{font-size:14px;font-weight:500;color:var(--t);}
.salon-type{font-size:10px;color:var(--tl);margin-top:2px;}
.salon-contact{font-size:11px;color:var(--tl);margin-top:6px;}
.badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.b-pending{background:#f1efe8;color:#444441;}
.b-interested{background:#eaf3de;color:#27500a;}
.b-callback{background:#faeeda;color:#633806;}
.b-nope{background:#fcebeb;color:#791f1f;}
.b-called{background:#eeedfe;color:#3c3489;}

/* SCRIPT VIEW */
.script-view{display:none;padding:0;}
.script-hdr{background:var(--ld);padding:20px;color:white;}
.script-salon{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:2px;}
.script-type{font-size:12px;opacity:0.75;}
.script-contact{font-size:12px;opacity:0.9;margin-top:8px;background:rgba(255,255,255,0.15);padding:8px 12px;border-radius:10px;}
.script-body{padding:16px;display:flex;flex-direction:column;gap:12px;}
.script-section{background:var(--w);border-radius:14px;border:0.5px solid rgba(200,168,233,0.2);overflow:hidden;}
.script-section-hdr{background:var(--ll);padding:10px 14px;font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--ld);}
.script-section-body{padding:14px;}
.script-line{font-size:14px;color:var(--t);line-height:1.7;background:rgba(200,168,233,0.08);border-radius:10px;padding:12px;border-left:3px solid var(--lm);margin-bottom:8px;}
.script-note{font-size:12px;color:var(--tl);font-style:italic;line-height:1.6;margin-top:6px;}
.objection{margin-bottom:10px;padding-bottom:10px;border-bottom:0.5px solid rgba(200,168,233,0.2);}
.objection:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.obj-q{font-size:13px;font-weight:500;color:var(--t);margin-bottom:4px;}
.obj-a{font-size:13px;color:var(--tm);line-height:1.6;font-weight:300;}
.status-bar{padding:12px 16px;background:var(--w);border-top:0.5px solid rgba(200,168,233,0.2);display:flex;gap:6px;flex-shrink:0;}
.s-btn{flex:1;padding:10px 6px;border-radius:20px;border:none;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;cursor:pointer;}
.s-interested{background:#eaf3de;color:#27500a;}
.s-callback{background:#faeeda;color:#633806;}
.s-nope{background:#fcebeb;color:#791f1f;}
.back-btn{background:rgba(255,255,255,0.2);color:white;border:none;padding:6px 14px;border-radius:20px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;}

.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>

var STATUS_KEY = 'mo-call-statuses';
var statuses = loadStatuses();
var currentSalon = null;
var currentFilter = 'all';

function loadStatuses() {
  try {
    var raw = localStorage.getItem(STATUS_KEY);
    if(!raw) return {};
    var parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : {};
  } catch(e) {
    return {};
  }
}

function saveStatuses() {
  localStorage.setItem(STATUS_KEY, JSON.stringify(statuses));
}

function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function updateProgress() {
  var called = salons.filter(function(s){ return statuses[s.id] && statuses[s.id] !== 'pending'; }).length;
  var total = salons.length;
  document.getElementById('progressEl').textContent = called + '/' + total + ' called';
  document.getElementById('hdrSub').textContent = 'Call scripts · ' + total + ' salons';
}

function badgeHtml(s) {
  var st = statuses[s.id] || 'pending';
  var map = { pending:['b-pending','Not called'], interested:['b-interested','Interested!'], callback:['b-callback','Call back'], nope:['b-nope','Not interested'], called:['b-called','Called'] };
  var d = map[st] || map.pending;
  return '<span class="badge '+d[0]+'">'+d[1]+'</span>';
}

function renderList() {
  var q = document.getElementById('srch').value.toLowerCase();
  var filters = ['all','pending','interested','callback','nope'];
  var labels = {all:'All',pending:'Not called',interested:'Interested',callback:'Call back',nope:'Not interested'};
  document.getElementById('filterRow').innerHTML = filters.map(function(f){
    return '<button class="chip'+(currentFilter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+(labels[f])+'</button>';
  }).join('');

  var list = salons.filter(function(s){
    var mq = !q || s.name.toLowerCase().indexOf(q)>-1 || s.type.toLowerCase().indexOf(q)>-1;
    var st = statuses[s.id] || 'pending';
    var mf = currentFilter==='all' || st===currentFilter;
    return mq && mf;
  });

  var el = document.getElementById('salonList');
  if(list.length===0){ el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--tl);font-size:14px;">No salons found</div>'; return; }
  el.innerHTML = list.map(function(s){
    return '<div class="salon-card" onclick="openScript('+s.id+')">'
    +'<div class="salon-card-top"><div><div class="salon-name">'+s.name+'</div><div class="salon-type">'+s.type+' · '+s.platform+'</div></div>'+badgeHtml(s)+'</div>'
    +'<div class="salon-contact">'+s.email+' · '+s.phone+'</div>'
    +'</div>';
  }).join('');
}

function setFilter(f) { currentFilter=f; renderList(); }

function openScript(id) {
  var s = salons.find(function(x){ return x.id===id; });
  if(!s) return;
  currentSalon = s;
  document.getElementById('sv-name').textContent = s.name;
  document.getElementById('sv-type').textContent = s.type + ' · ' + s.platform;
  document.getElementById('sv-contact').innerHTML = '📧 ' + s.email + '<br>📞 ' + s.phone;
  document.getElementById('sv-body').innerHTML =
    section('Opening line','Say this to get through to the owner',[s.opening], [], "Ask for "+s.owner+" by name if possible.")
    + section('The pitch','Once you have the owner on the line',[s.pitch], [], "Be warm and confident. Pause after the pitch — let them react.")
    + section('Your offer','Follow with this',[s.offer], [], "")
    + section('The close','Always end with a clear next step',[s.close], [], "If they say yes — get their email address, confirm it back, say Morolake will be in touch within the hour.")
    + objSection(s.objections);
  document.getElementById('listView').style.display='none';
  document.getElementById('scriptView').style.display='flex';
  document.getElementById('scriptView').style.flexDirection='column';
  document.getElementById('scriptView').style.height='100%';
  document.getElementById('appBody').scrollTop=0;
  if(!statuses[id]) {
    statuses[id]='called';
    saveStatuses();
    updateProgress();
  }
}

function section(title, sub, lines, obj, note) {
  return '<div class="script-section">'
    +'<div class="script-section-hdr">'+title+'</div>'
    +'<div class="script-section-body">'
    +(sub?'<p style="font-size:11px;color:var(--tl);margin-bottom:8px;">'+sub+'</p>':'')
    +lines.map(function(l){ return '<div class="script-line">'+l+'</div>'; }).join('')
    +(note?'<p class="script-note">'+note+'</p>':'')
    +'</div></div>';
}

function objSection(objs) {
  if(!objs||!objs.length) return '';
  return '<div class="script-section">'
    +'<div class="script-section-hdr">Common objections</div>'
    +'<div class="script-section-body">'
    +objs.map(function(o){
      return '<div class="objection"><div class="obj-q">"'+o.q+'"</div><div class="obj-a">'+o.a+'</div></div>';
    }).join('')
    +'</div></div>';
}

function goBack() {
  document.getElementById('scriptView').style.display='none';
  document.getElementById('listView').style.display='block';
  currentSalon=null;
  renderList();
  updateProgress();
}

function setStatus(st) {
  if(!currentSalon) return;
  statuses[currentSalon.id]=st;
  saveStatuses();
  toast(st==='interested'?'Marked as interested! 🦋':st==='callback'?'Call back noted!':'Marked as not interested');
  updateProgress();
}

renderList();
updateProgress();
</script>
