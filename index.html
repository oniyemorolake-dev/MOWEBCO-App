<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6b3fa0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MO-WEBCO CRM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--l:#c8a8e9;--ll:#ecdff7;--lm:#9b6fc4;--ld:#6b3fa0;--cr:#faf7fd;--w:#fff;--t:#2a1a3e;--tm:#5a4570;--tl:#9980b0;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cr);font-family:'DM Sans',sans-serif;}
.app{width:100vw;height:100dvh;min-height:100vh;background:var(--cr);display:flex;flex-direction:column;overflow:hidden;position:relative;}
.hdr{background:var(--w);padding:calc(16px + env(safe-area-inset-top)) 20px 12px;border-bottom:0.5px solid rgba(200,168,233,0.3);flex-shrink:0;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--ld);}
.hdr-sub{font-size:11px;color:var(--tl);margin-top:2px;}
.hdr-badge{background:var(--ll);color:var(--ld);font-size:10px;font-weight:500;padding:4px 10px;border-radius:20px;}
.body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}
.bnav{background:var(--w);border-top:0.5px solid rgba(200,168,233,0.3);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.ni{flex:1;padding:12px 4px 10px;text-align:center;cursor:pointer;}
.ni-icon{font-size:20px;display:block;}
.ni-label{font-size:9px;color:var(--tl);margin-top:3px;display:block;}
.ni.active .ni-label{color:var(--ld);font-weight:500;}
.screen{display:none;}.screen.on{display:block;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.scard{background:var(--w);border-radius:14px;padding:14px;border:0.5px solid rgba(200,168,233,0.25);text-align:center;}
.snum{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--ld);}
.slbl{font-size:10px;color:var(--tl);margin-top:2px;}
.sec{font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--tm);margin:16px 0 8px;}
.lcard{background:var(--w);border-radius:14px;padding:12px 14px;border:0.5px solid rgba(200,168,233,0.2);margin-bottom:8px;cursor:pointer;}
.lcard-top{display:flex;align-items:center;justify-content:space-between;}
.lname{font-size:14px;font-weight:500;color:var(--t);}
.lmeta{font-size:10px;color:var(--tl);margin-top:3px;}
.lbody{margin-top:10px;padding-top:10px;border-top:0.5px solid rgba(200,168,233,0.2);display:none;}
.lcard.open .lbody{display:block;}
.lnotes{font-size:12px;color:var(--tm);line-height:1.5;margin-bottom:10px;font-weight:300;}
.acts{display:flex;gap:8px;}
.bsm{flex:1;padding:8px;border-radius:20px;border:1px solid rgba(200,168,233,0.4);background:transparent;color:var(--ld);font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
.bsm.del{border-color:rgba(226,75,74,0.3);color:#791f1f;}
.bsm.pri{background:var(--ld);color:#fff;border-color:var(--ld);}
.fucard{background:rgba(200,168,233,0.15);border-radius:14px;padding:12px 14px;border:1px solid rgba(200,168,233,0.4);margin-bottom:8px;cursor:pointer;}
.fucard.late{background:rgba(226,75,74,0.08);border-color:rgba(226,75,74,0.3);}
.futag{font-size:10px;font-weight:500;color:var(--ld);margin-bottom:3px;}
.futag.late{color:#791f1f;}
.funame{font-size:13px;font-weight:500;color:var(--t);}
.fudue{font-size:10px;color:var(--tl);margin-top:2px;}
.badge{font-size:10px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.b-sent{background:#e6f1fb;color:#0c447c;}
.b-noreply{background:#f1efe8;color:#444441;}
.b-replied{background:#eaf3de;color:#27500a;}
.b-talks{background:#faeeda;color:#633806;}
.b-won{background:#eeedfe;color:#3c3489;}
.b-nope{background:#fcebeb;color:#791f1f;}
.fg{margin-bottom:14px;}
.fl{font-size:11px;font-weight:500;color:var(--tm);display:block;margin-bottom:5px;}
.fi{width:100%;padding:12px 14px;border:1.5px solid rgba(200,168,233,0.3);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--t);background:var(--w);outline:none;}
.fi:focus{border-color:var(--lm);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bfull{width:100%;padding:14px;background:var(--ld);color:#fff;border:none;border-radius:30px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:6px;}
.overlay{position:absolute;inset:0;background:rgba(42,26,62,0.6);z-index:50;display:flex;align-items:flex-end;}
.modal{background:var(--w);border-radius:28px 28px 0 0;padding:24px 20px 32px;width:100%;max-height:85%;overflow-y:auto;}
.mtitle{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--t);margin-bottom:4px;}
.msub{font-size:12px;color:var(--tl);margin-bottom:16px;}
.ebox{background:var(--cr);border:1.5px solid rgba(200,168,230,0.3);border-radius:14px;padding:14px;font-size:13px;color:var(--tm);line-height:1.7;white-space:pre-wrap;font-weight:300;min-height:100px;}
.macts{display:flex;gap:10px;margin-top:14px;}
.bcopy{flex:1;padding:12px;background:var(--ld);color:#fff;border:none;border-radius:20px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;}
.bclose{padding:12px 20px;border:1px solid rgba(200,168,233,0.4);background:transparent;border-radius:20px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--tm);cursor:pointer;}
.ldots{display:flex;align-items:center;gap:8px;color:var(--tl);font-size:13px;padding:20px 0;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--l);animation:pulse 1.2s infinite;}
.dot:nth-child(2){animation-delay:0.2s;}.dot:nth-child(3){animation-delay:0.4s;}
@keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}
.srch{width:100%;padding:10px 14px;border:1.5px solid rgba(200,168,233,0.3);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--t);background:var(--w);outline:none;margin-bottom:12px;}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:5px 12px;border-radius:20px;border:1px solid rgba(200,168,233,0.3);background:transparent;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--tm);cursor:pointer;white-space:nowrap;}
.chip.on{background:var(--ld);color:#fff;border-color:var(--ld);}
.empty{text-align:center;padding:40px 20px;color:var(--tl);}
.empty-ic{font-size:40px;margin-bottom:12px;}
.empty p{font-size:14px;line-height:1.6;}
.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-row">
      <div><div class="logo">MO-WEBCO 🦋</div><div class="hdr-sub">Outreach tracker</div></div>
      <div class="hdr-badge" id="hbadge">0 leads</div>
    </div>
  </div>

  <div class="body" id="appBody">
    <div class="screen on" id="s-dash">
      <div class="grid2">
        <div class="scard"><div class="snum" id="st0">0</div><div class="slbl">Total leads</div></div>
        <div class="scard"><div class="snum" id="st1">0</div><div class="slbl">Clients won</div></div>
        <div class="scard"><div class="snum" id="st2">0</div><div class="slbl">Replied</div></div>
        <div class="scard"><div class="snum" id="st3">0</div><div class="slbl">In talks</div></div>
      </div>
      <div class="sec">Follow up today</div>
      <div id="fuList"></div>
      <div class="sec">Recent leads</div>
      <div id="recList"></div>
    </div>

    <div class="screen" id="s-add">
      <div class="fg"><label class="fl">Business name *</label><input class="fi" id="f-biz" type="text" placeholder="e.g. Luxe Nail Studio"></div>
      <div class="fg"><label class="fl">Owner name (optional)</label><input class="fi" id="f-own" type="text" placeholder="e.g. Sarah"></div>
      <div class="fg"><label class="fl">Email address *</label><input class="fi" id="f-em" type="email" placeholder="hello@business.com"></div>
      <div class="fg"><label class="fl">Business type</label>
        <select class="fi" id="f-type">
          <option>Nail Salon</option><option>Hair Salon</option><option>Barbershop</option>
          <option>Spa</option><option>Restaurant</option><option>Trades</option>
          <option>Real Estate</option><option>Other</option>
        </select>
      </div>
      <div class="fg"><label class="fl">Status</label>
        <select class="fi" id="f-stat">
          <option value="sent">Sent</option><option value="noreply">No Reply</option>
          <option value="replied">Replied</option><option value="talks">In Talks</option>
          <option value="won">Client Won</option><option value="nope">Not Interested</option>
        </select>
      </div>
      <div class="frow">
        <div class="fg"><label class="fl">Date contacted</label><input class="fi" id="f-dt" type="date"></div>
        <div class="fg"><label class="fl">Follow up date</label><input class="fi" id="f-fu" type="date"></div>
      </div>
      <div class="fg"><label class="fl">Their website (optional)</label><input class="fi" id="f-web" type="url" placeholder="https://..."></div>
      <div class="fg"><label class="fl">Notes</label><textarea class="fi" id="f-note" rows="3" placeholder="Anything to remember..."></textarea></div>
      <button class="bfull" id="saveBtn" onclick="saveLead()">Save lead 🦋</button>
    </div>

    <div class="screen" id="s-all">
      <input class="srch" id="srch" type="text" placeholder="Search leads..." oninput="renderAll()">
      <div class="chips" id="chipRow"></div>
      <div id="allList"></div>
    </div>
  </div>

  <div class="bnav">
    <div class="ni active" id="n0" onclick="go('dash',0)"><span class="ni-icon">🏠</span><span class="ni-label">Dashboard</span></div>
    <div class="ni" id="n1" onclick="go('add',1)"><span class="ni-icon">➕</span><span class="ni-label">Add lead</span></div>
    <div class="ni" id="n2" onclick="go('all',2)"><span class="ni-icon">📋</span><span class="ni-label">All leads</span></div>
  </div>

  <div class="overlay" id="modal" style="display:none;" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal">
      <div class="mtitle" id="mtitle">AI email writer 🦋</div>
      <div class="msub" id="msub"></div>
      <div id="mcontent"><div class="ldots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span>Writing your email...</span></div></div>
      <div class="macts">
        <button class="bcopy" id="bcopy" onclick="doCopy()" style="display:none">Copy email</button>
        <button class="bclose" onclick="document.getElementById('modal').style.display='none'">Close</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
var leads = JSON.parse(localStorage.getItem('mo-leads') || '[]');
var eid = null;
var filt = 'all';
var genEmail = '';
var akey = localStorage.getItem('mo-akey') || '';

function td() { return new Date().toISOString().split('T')[0]; }
function fd() { var d = new Date(); d.setDate(d.getDate()+4); return d.toISOString().split('T')[0]; }
function save() { localStorage.setItem('mo-leads', JSON.stringify(leads)); }

function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function bc(s) {
  var m = {sent:'b-sent',noreply:'b-noreply',replied:'b-replied',talks:'b-talks',won:'b-won',nope:'b-nope'};
  return m[s] || 'b-sent';
}
function bl(s) {
  var m = {sent:'Sent',noreply:'No Reply',replied:'Replied',talks:'In Talks',won:'Client Won ✦',nope:'Not Interested'};
  return m[s] || s;
}

function go(name, idx) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
  document.querySelectorAll('.ni').forEach(function(n){ n.classList.remove('active'); });
  document.getElementById('s-'+name).classList.add('on');
  document.getElementById('n'+idx).classList.add('active');
  document.getElementById('appBody').scrollTop = 0;
  if(name==='dash') renderDash();
  if(name==='all') renderAll();
  if(name==='add' && !eid) clearForm();
}

function clearForm() {
  eid = null;
  document.getElementById('f-biz').value = '';
  document.getElementById('f-own').value = '';
  document.getElementById('f-em').value = '';
  document.getElementById('f-type').value = 'Nail Salon';
  document.getElementById('f-stat').value = 'sent';
  document.getElementById('f-dt').value = td();
  document.getElementById('f-fu').value = fd();
  document.getElementById('f-web').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('saveBtn').textContent = 'Save lead 🦋';
}

function saveLead() {
  var biz = document.getElementById('f-biz').value.trim();
  var em = document.getElementById('f-em').value.trim();
  if(!biz || !em) { toast('Business name and email are required!'); return; }
  var lead = {
    id: eid || Date.now().toString(),
    biz: biz, em: em,
    own: document.getElementById('f-own').value.trim(),
    type: document.getElementById('f-type').value,
    stat: document.getElementById('f-stat').value,
    dt: document.getElementById('f-dt').value,
    fu: document.getElementById('f-fu').value,
    web: document.getElementById('f-web').value.trim(),
    note: document.getElementById('f-note').value.trim()
  };
  if(eid) {
    var i = leads.findIndex(function(l){ return l.id===eid; });
    leads[i] = lead;
  } else {
    leads.unshift(lead);
  }
  save();
  toast(eid ? 'Lead updated!' : 'Lead saved! 🦋');
  clearForm();
  go('dash', 0);
}

function delLead(id) {
  if(!confirm('Delete this lead?')) return;
  leads = leads.filter(function(l){ return l.id !== id; });
  save(); renderAll(); renderDash();
  toast('Deleted');
}

function editLead(id) {
  var l = leads.find(function(l){ return l.id===id; });
  if(!l) return;
  eid = id;
  document.getElementById('f-biz').value = l.biz;
  document.getElementById('f-own').value = l.own || '';
  document.getElementById('f-em').value = l.em;
  document.getElementById('f-type').value = l.type;
  document.getElementById('f-stat').value = l.stat;
  document.getElementById('f-dt').value = l.dt;
  document.getElementById('f-fu').value = l.fu;
  document.getElementById('f-web').value = l.web || '';
  document.getElementById('f-note').value = l.note || '';
  document.getElementById('saveBtn').textContent = 'Update lead 🦋';
  go('add', 1);
}

function renderDash() {
  var now = td();
  document.getElementById('st0').textContent = leads.length;
  document.getElementById('st1').textContent = leads.filter(function(l){ return l.stat==='won'; }).length;
  document.getElementById('st2').textContent = leads.filter(function(l){ return l.stat==='replied'; }).length;
  document.getElementById('st3').textContent = leads.filter(function(l){ return l.stat==='talks'; }).length;
  document.getElementById('hbadge').textContent = leads.length + (leads.length===1 ? ' lead' : ' leads');

  var due = leads.filter(function(l){ return l.fu && l.fu <= now && l.stat !== 'won' && l.stat !== 'nope'; });
  var fuEl = document.getElementById('fuList');
  if(due.length === 0) {
    fuEl.innerHTML = '<div class="empty" style="padding:12px 0"><p style="font-size:13px">No follow ups due today</p></div>';
  } else {
    fuEl.innerHTML = due.map(function(l){
      var late = l.fu < now;
      return '<div class="fucard'+(late?' late':'')+'" onclick="openModal(\''+l.id+'\',\'fu\')">'
        +'<div class="futag'+(late?' late':'')+'">'+(late?'Overdue':'Due today')+'</div>'
        +'<div class="funame">'+l.biz+'</div>'
        +'<div class="fudue">Tap to write follow up email</div>'
        +'</div>';
    }).join('');
  }

  var rec = leads.slice(0,5);
  var rEl = document.getElementById('recList');
  if(rec.length === 0) {
    rEl.innerHTML = '<div class="empty"><div class="empty-ic">🦋</div><p>No leads yet<br>Add your first lead to get started</p></div>';
  } else {
    rEl.innerHTML = rec.map(function(l){ return cardHtml(l); }).join('');
  }
}

function renderAll() {
  var chips = ['all','sent','noreply','replied','talks','won','nope'];
  var labels = {all:'All',sent:'Sent',noreply:'No Reply',replied:'Replied',talks:'In Talks',won:'Won',nope:'Not Interested'};
  document.getElementById('chipRow').innerHTML = chips.map(function(c){
    return '<button class="chip'+(filt===c?' on':'')+'" onclick="setFilt(\''+c+'\')">'+(labels[c])+'</button>';
  }).join('');

  var q = document.getElementById('srch').value.toLowerCase();
  var list = leads.filter(function(l){
    var mq = !q || l.biz.toLowerCase().indexOf(q)>-1 || l.em.toLowerCase().indexOf(q)>-1;
    var mf = filt==='all' || l.stat===filt;
    return mq && mf;
  });

  var el = document.getElementById('allList');
  if(list.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-ic">🔍</div><p>No leads found</p></div>';
  } else {
    el.innerHTML = list.map(function(l){ return cardHtml(l); }).join('');
  }
}

function setFilt(f) { filt = f; renderAll(); }

function cardHtml(l) {
  return '<div class="lcard" onclick="this.classList.toggle(\'open\')">'
    +'<div class="lcard-top">'
    +'<div><div class="lname">'+l.biz+'</div><div class="lmeta">'+l.type+' · '+l.dt+'</div></div>'
    +'<span class="badge '+bc(l.stat)+'">'+bl(l.stat)+'</span>'
    +'</div>'
    +'<div class="lbody">'
    +(l.note ? '<div class="lnotes">'+l.note+'</div>' : '')
    +'<div class="acts">'
    +'<button class="bsm pri" onclick="event.stopPropagation();openModal(\''+l.id+'\',\'cold\')">✉️ Write email</button>'
    +'<button class="bsm" onclick="event.stopPropagation();editLead(\''+l.id+'\')">Edit</button>'
    +'<button class="bsm del" onclick="event.stopPropagation();delLead(\''+l.id+'\')">Delete</button>'
    +'</div>'
    +'</div>'
    +'</div>';
}

function openModal(id, type) {
  if(!akey) { showKeySetup(); return; }
  var l = leads.find(function(l){ return l.id===id; });
  if(!l) return;
  genEmail = '';
  document.getElementById('bcopy').style.display = 'none';
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('mtitle').textContent = type==='cold' ? 'Cold email 🦋' : 'Follow up email 🦋';
  document.getElementById('msub').textContent = l.biz + ' · ' + l.type;
  document.getElementById('mcontent').innerHTML = '<div class="ldots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span>Claude is writing your email...</span></div>';

  var prompt = type === 'cold'
    ? 'Write a short friendly cold outreach email from Morolake at MO-WEBCO (a Calgary web developer) to '+(l.own||'the owner')+' of "'+l.biz+'", a '+l.type+' in Calgary. The email should: be warm and personal not salesy, mention she noticed their business and thinks a modern website could help get more clients, say MO-WEBCO builds sites from $150, offer a free quote, be under 120 words, end with mowebsiteco@gmail.com.'+(l.web?' She visited their site at '+l.web+' and has ideas to improve it.':'')+' Format: Subject: line first then email body only. No extra commentary.'
    : 'Write a very short friendly follow up email from Morolake at MO-WEBCO to the owner of "'+l.biz+'", a '+l.type+' in Calgary. She emailed them about a website a few days ago and has not heard back. Under 60 words, light and friendly not pushy, just checking if they saw her email, mention mowebsiteco@gmail.com. Format: Subject: line first then email body only. No extra commentary.';

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': akey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 400,
      messages: [{ role: 'user', content: prompt }]
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    genEmail = (d.content || []).map(function(c){ return c.text||''; }).join('');
    document.getElementById('mcontent').innerHTML = '<div class="ebox">'+genEmail+'</div>';
    document.getElementById('bcopy').style.display = 'block';
  })
  .catch(function(){
    document.getElementById('mcontent').innerHTML = '<div class="ebox">Could not connect. Check your API key in settings.</div>';
  });
}

function showKeySetup() {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('mtitle').textContent = 'Set up AI emails 🦋';
  document.getElementById('msub').textContent = 'One time setup · 2 minutes';
  document.getElementById('bcopy').style.display = 'none';
  document.getElementById('mcontent').innerHTML = ''
    +'<p style="font-size:13px;color:var(--tm);line-height:1.7;margin-bottom:14px;font-weight:300;">'
    +'Get a free Anthropic API key to use AI email writing:<br><br>'
    +'1. Go to <b style="color:var(--ld)">console.anthropic.com</b><br>'
    +'2. Sign up free<br>'
    +'3. Click API Keys → Create Key<br>'
    +'4. Paste it below'
    +'</p>'
    +'<input class="fi" id="keyIn" type="password" placeholder="sk-ant-api03-..." style="margin-bottom:10px">'
    +'<button class="bfull" onclick="saveKey()" style="margin-top:0">Save key</button>';
}

function saveKey() {
  var k = document.getElementById('keyIn').value.trim();
  if(!k || k.length < 20) { toast('Paste a valid API key'); return; }
  akey = k;
  localStorage.setItem('mo-akey', k);
  document.getElementById('modal').style.display = 'none';
  toast('Key saved! Tap Write email to try it 🦋');
}

function doCopy() {
  if(!genEmail) return;
  if(navigator.clipboard) {
    navigator.clipboard.writeText(genEmail).then(function(){
      toast('Copied! Paste into Gmail 🦋');
      document.getElementById('modal').style.display = 'none';
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = genEmail;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Copied! Paste into Gmail 🦋');
    document.getElementById('modal').style.display = 'none';
  }
}

clearForm();
renderDash();
if(!akey) setTimeout(showKeySetup, 800);
</script>
</body>
